# ============ Lot spotter (main.py) ============
# Your search terms live in searches.yaml. Scoring points live in score.py.
spotter:
  every_minutes: 10          # how often a scan runs (an outside timer starts one every 10 min)
  night_every_minutes: 60    # during quiet hours (below), search at most this often: saves API calls
  lots_category: "261329"    # eBay "Sports Trading Card Lots"
  singles_category: "261328" # eBay "Sports Trading Card Singles": many small lots are listed here too
  results_per_search: 200    # eBay's maximum per call
  auction_hours: 3           # auctions are searched only in their last 3 hours
  max_price: 300             # skip lots above this (price + shipping)
  max_price_per_card: 5.00   # skip lots costing more than this per card (when the count is known)
  detail_lookups_per_run: 10 # new lots per run whose item specifics + description we fetch
                             # (1 call each, best-looking first): real shipping, Sport, players
  bin_show_hours: 3          # a Buy It Now lot stays on the page this long after a search last saw it
  max_age_hours: 36          # ...and leaves the page this long after it was LISTED, to keep the page
                             # fresh (auctions stay until they end; they're only shown in their last hours)
  page_min_score: 20         # lots scoring less than this don't go on the page
  max_per_tab: 60            # at most this many lots per page tab
  alert_min_score: 60        # phone alert for NEW lots scoring at least this (and Sport checked)
  player_search_top: 24      # player-name searches cover the top N prospects in prospects.yaml
  learned_searches: 4        # new searches built from your Good/Medium/Bad ratings (every 30 min)
  ship_to_zip: "43210"       # ZIP eBay uses to calculate shipping (Columbus, OH). This file is public.
  repo: eliallen2023-star/card-scanner   # for the "edit your searches" link on the page

# Titles containing any of these are skipped
exclude_words: [reprint, " rp ", custom, digital, facsimile, "you pick", "pick your",
                "u pick", choose, "your choice", "complete your set", proxy, novelty,
                # Hand-signed (uncertified) cards are worth far less than certified autos.
                # Not plain "on card": sellers use that for real certified autos too.
                " ttm ", "in person", " ip auto", " ip signed", "hand signed", "signed on card"]

# ---- Phone alerts (ntfy) ----
alerts:
  timezone: America/New_York
  quiet_start: 23           # no pushes from 11pm...
  quiet_end: 8              # ...until 8am (good lots wait for the next morning scan)
  max_per_run: 8

# ============ Used by paste.py and check.py (judging cards you paste in) ============
deal:
  min_discount: 0.30        # total cost must be at least 30% below the median sale
  min_profit: 10.00         # estimated profit after fees/shipping, in dollars
  min_comps: 3              # need at least this many recent sales to trust the median
  comp_days: 45             # only use sales from the last N days
  ebay_fee_rate: 0.1325     # eBay final value fee (approx, trading cards)
  ship_out_cost: 4.50       # what it costs you to ship when you resell (BMWT)

lots:
  min_single_value: 6.00    # cards worth less than this count $0 toward resale profit
  ship_per_card: 1.50       # your cost to mail one single
  min_asks: 5               # a card's value from asking prices needs this many listings
  max_copies_valued: 3      # only this many copies of one card count
  bulk:                     # "cheap 1st/RC lot" verdict in paste.py
    enabled: true
    max_price_per_card: 1.00
    min_cards: 5

recommend:
  ask_days: 14              # asking prices seen in the last N days
  min_asks: 3               # need at least this many listings of the exact card
  min_under_ask: 0.25       # "good vs. asking prices" = at least 25% under their median
